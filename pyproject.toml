[project]
name = "agentic-research-harness"
version = "0.1.0"
description = "Independent research agents (analyst, ideator, forecaster) over one shared note store."
requires-python = ">=3.11"
dependencies = ["claude-agent-sdk>=0.2.168", "numpy", "polars", "scikit-learn", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[project.scripts]
arh = "arh.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arh = ["agents/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
