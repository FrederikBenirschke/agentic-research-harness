name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # the model sandbox uses macOS sandbox-exec
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - run: pytest -q
